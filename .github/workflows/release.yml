name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: simd_sse2
            name: signum-miner-sse2-linux
          - os: ubuntu-latest
            features: simd_avx2
            name: signum-miner-avx2-linux
          - os: ubuntu-latest
            features: opencl,simd_avx2
            name: signum-miner-avx2-opencl-linux
          - os: windows-latest
            features: simd_sse2
            name: signum-miner-sse2-windows
          - os: windows-latest
            features: simd_avx2
            name: signum-miner-avx2-windows
          - os: windows-latest
            features: opencl,simd_avx2
            name: signum-miner-avx2-opencl-windows

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCL ICD loader (GPU Linux builds)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'opencl,simd_avx2'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install OpenCL import lib (GPU Windows builds)
        if: matrix.os == 'windows-latest' && matrix.features == 'opencl,simd_avx2'
        shell: pwsh
        run: |
          vcpkg install opencl:x64-windows
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\opencl\lib\x64" | Out-Null
          Copy-Item "$env:vcpkg\installed\x64-windows\lib\OpenCL.lib" "$env:RUNNER_TEMP\opencl\lib\x64\OpenCL.lib"
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$env:RUNNER_TEMP\opencl"

      - name: Build
        run: cargo build --release --no-default-features --features ${{ matrix.features }}

      - name: Rename binary
        shell: bash
        run: |
          cp "target/release/signum-miner" "${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Signum Miner ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

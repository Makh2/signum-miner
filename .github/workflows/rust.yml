name: Rust

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenCL ICD loader
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests without default features
        run: cargo test --no-default-features --verbose
      - name: Run tests with the OpenCL GPU worker
        run: cargo test --no-default-features --features opencl,simd_avx2 --verbose
